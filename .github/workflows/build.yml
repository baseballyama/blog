name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# ref ごとに直列化する。PR は同一ブランチへの連続 push で古い run を打ち切り、
# main は途中キャンセルせず順番に流す（デプロイに割り込ませないため）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 静的解析。JS/TS は oxlint、.svelte は rsvelte-lint (rsvelte コンパイラの
      # warning/a11y + eslint-plugin-svelte 互換ルール) が担当する。CI 用の
      # `lint:ci` は oxlint に --deny-warnings、rsvelte-lint に --max-warnings 0 を
      # 付けて warning も失敗扱いにする (ローカルの `pnpm lint` は開発体験のため
      # warning 非致命のまま)。
      - run: pnpm lint:ci

      # rsvelte-fmt によるフォーマット検査。.svelte はネイティブ整形し、それ以外は
      # oxfmt へ委譲する。差分があれば失敗する。
      - run: pnpm format:check

      # SvelteKit (rsvelte コンパイラ経由) でビルドし、.svelte-kit/cloudflare へ
      # Worker と静的アセットを出力する。前段で GitHub のスター数の再取得・OGP 画像の
      # 生成 (resvg) ・mermaid バンドルの生成が走る。
      - run: pnpm build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - run: pnpm check

      # deploy ジョブへ渡す。_worker.js は .svelte-kit/output/server と
      # cloudflare-tmp/manifest.js を参照するので、cloudflare/ だけでは足りず
      # .svelte-kit/ ごと引き渡す。
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: .svelte-kit/
          include-hidden-files: true
          retention-days: 7

  # デプロイを別ジョブに分けているのは environment を付けるため。これで GitHub の
  # Deployments / Environments にデプロイ履歴が残る (wrangler-action 自身も
  # GitHub Deployment を作る機能を持つが、Cloudflare Pages の出力からしか呼ばれず
  # Workers のデプロイでは動かない)。
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://blog.baseballyama.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # wrangler 本体を lockfile 固定のバージョンで入れるためだけの install。
      # postinstall の `svelte-kit sync` が .svelte-kit/ に書くので、成果物の
      # 展開はこの後に行う。
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: .svelte-kit/

      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
